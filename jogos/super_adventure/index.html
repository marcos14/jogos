<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Super Adventure</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍄</text></svg>">
</head>
<body>

<div id="app">

  <!-- ------------------------------------------------------------ HUD ----- -->
  <!-- Provisorio: por enquanto so mostra os numeros. Pontos, vidas e fase
       ganham logica de verdade nas fases seguintes do plano. -->
  <header id="hud" class="hidden">
    <div class="hud-box">
      <span class="hud-label">Pontos</span>
      <strong id="hud-pontos">0</strong>
    </div>
    <div class="hud-box">
      <span class="hud-label">Vidas</span>
      <strong id="hud-vidas">❤️❤️❤️</strong>
    </div>
    <div class="hud-box">
      <span class="hud-label">Fase</span>
      <strong id="hud-fase">1 / 3</strong>
    </div>
  </header>

  <!-- ---------------------------------------------------------- Palco ----- -->
  <div id="palco">
    <canvas id="tela" width="960" height="540"></canvas>

    <!-- Tela inicial -->
    <section id="tela-menu" class="tela">
      <div class="painel">
        <h1 class="titulo">SUPER<br><span class="destaque">ADVENTURE</span></h1>
        <p class="subtitulo">Corra, pule e chegue na bandeira</p>

        <button id="btn-solo" type="button" class="botao">JOGAR SOLO</button>

        <ul class="ajuda">
          <li><b>&larr; &rarr;</b> ou <b>A / D</b> — andar</li>
          <li><b>ESPAÇO</b> ou <b>&uarr;</b> — pular</li>
        </ul>
      </div>
    </section>

    <!-- Fim da fase: aparece quando alguém encosta na bandeira. Avançar para a
         fase 2 é assunto de outra etapa do plano; por enquanto dá para
         recomeçar a fase 1. -->
    <section id="tela-fim" class="tela hidden">
      <div class="painel">
        <h1 class="titulo"><span class="destaque">FASE 1</span><br>CONCLUÍDA!</h1>
        <p class="subtitulo">Você chegou na bandeira 🚩</p>

        <button id="btn-de-novo" type="button" class="botao">JOGAR DE NOVO</button>
      </div>
    </section>
  </div>

  <footer id="rodape">Corra até a bandeira: cuidado com os buracos!</footer>
</div>

<script src="game.js" charset="utf-8"></script>
</body>
</html>
