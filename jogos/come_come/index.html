<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Come-Come</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟡</text></svg>">
</head>
<body>

<div id="app">

  <!-- ---------------------------------------------------------- Palco ----- -->
  <!-- O canvas tem por dentro o tamanho exato do labirinto (28 x 31 quadrados
       de 16px = 448 x 496). O CSS só decide de que tamanho ele APARECE, sempre
       na mesma proporção: assim as posições são as mesmas em qualquer tela —
       que é o que vai deixar anfitrião e convidado batendo certo lá na frente. -->
  <div id="palco">
    <canvas id="tela" width="448" height="496"></canvas>
  </div>

  <footer id="rodape">Setas ou W A S D para virar nas esquinas — e cuidado com o túnel dos lados!</footer>
</div>

<script src="game.js" charset="utf-8"></script>
</body>
</html>
