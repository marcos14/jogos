<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- O favicon: o mesmo desenho dos PNG (gradiente amarelo -> rosa, 🎮 no meio).
       O emoji e' desenhado pela fonte do proprio aparelho, como nos jogos. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#g)"/>
  <text x="50" y="53" text-anchor="middle" dominant-baseline="central" font-size="58">🎮</text>
</svg>
