services:
  central-de-jogos:
    build: ./server
    container_name: central-de-jogos
    restart: unless-stopped

    ports:
      # host:container — mude só o número da esquerda se a porta estiver ocupada
      - "${PORTA_HOST:-8099}:3000"
      # https — só responde se HTTPS_CERT e HTTPS_CHAVE estiverem no .env
      # (é o que o Android exige para instalar a Central como app; veja o README)
      - "${PORTA_HTTPS_HOST:-8443}:3443"

    volumes:
      # É AQUI que os jogos moram. Copiar uma pasta para ./jogos já publica o jogo.
      - ./jogos:/app/jogos
      # O certificado do HTTPS, se você gerar um (opcional; certificados/LEIA-ME.txt)
      - ./certificados:/app/certificados:ro

    environment:
      TITULO: "${TITULO:-Central de Jogos}"
      TITULO_CURTO: "${TITULO_CURTO:-}"
      ADMIN_SENHA: "${ADMIN_SENHA:?defina ADMIN_SENHA no arquivo .env}"
      SESSAO_SEGREDO: "${SESSAO_SEGREDO:-}"
      SESSAO_HORAS: "${SESSAO_HORAS:-12}"
      MAX_ZIP_MB: "${MAX_ZIP_MB:-200}"
      MAX_DESCOMPACTADO_MB: "${MAX_DESCOMPACTADO_MB:-600}"
      PORTA_PUBLICA: "${PORTA_HOST:-8099}"
      HTTPS_CERT: "${HTTPS_CERT:-}"
      HTTPS_CHAVE: "${HTTPS_CHAVE:-}"
      PORTA_HTTPS_PUBLICA: "${PORTA_HTTPS_HOST:-8443}"
      PASTA_JOGOS: /app/jogos
      PASTA_TEMP: /app/tmp
      TZ: "${TZ:-America/Sao_Paulo}"

    tmpfs:
      # Os .zip recebidos ficam só na memória e somem sozinhos
      - /app/tmp:size=512m
